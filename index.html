<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Shape Camera</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <!-- Hidden source canvas + video -->
  <canvas id="source" style="display:none;"></canvas>
  <video id="video" playsinline autoplay muted style="display:none;"></video>

  <!-- START SCREEN -->
  <div id="start-screen">
    <div class="start-inner">
      <h1>Shape Camera</h1>
      <p class="tagline">stamp the world in flat color</p>
      <button id="btn-start">Enable Camera</button>
      <span class="note">requires camera permission</span>
    </div>
  </div>

  <!-- MAIN UI -->
  <div id="ui" class="hidden">
    <!-- Composition area (top 55%) -->
    <div id="composition-area">
      <canvas id="composition"></canvas>
      <button id="btn-save" class="icon-btn" aria-label="Save composition">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
      </button>
    </div>

    <!-- Viewfinder (mid 35%) -->
    <div id="viewfinder-area">
      <canvas id="viewfinder"></canvas>
    </div>

    <!-- Controls (bottom 10%) -->
    <div id="controls">
      <div id="palette-row">
        <button class="palette-btn active" data-palette="bold">Bold</button>
        <button class="palette-btn" data-palette="warm">Warm</button>
        <button class="palette-btn" data-palette="cool">Cool</button>
        <button class="palette-btn" data-palette="pop">Pop</button>
      </div>
      <div id="action-row">
        <button id="btn-undo" class="action-btn">↩ Undo</button>
        <button id="btn-clear" class="action-btn">✕ Clear</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
